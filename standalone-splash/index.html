<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>“未完” 启动加载画面 (独立预览)</title>
    <link rel="stylesheet" href="./splash.css" />
    <style>
      /* 测试台控制器样式 (仅用于本预览页，接入 SillyTavern 时无需引入) */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        background-color: #202736;
        color: #F5F6F9;
      }
      .test-panel {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100000;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        background: rgba(18, 22, 30, 0.9);
        backdrop-filter: blur(8px);
        padding: 0.5rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        max-width: 95vw;
      }
      .test-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #FFFFFF;
        font-size: 0.75rem;
        padding: 0.4rem 0.75rem;
        border-radius: 9999px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .test-btn:active {
        background: rgba(255, 255, 255, 0.25);
      }
      .under-content {
        padding: 3rem 1.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- 模拟宿主页面内容：当加载画面退出后，将呈现此内容 -->
    <div class="under-content">
      <h2 style="font-family: serif; font-size: 1.5rem; margin-bottom: 0.5rem;">SillyTavern 宿主页面已就绪</h2>
      <p style="font-size: 0.875rem; opacity: 0.7;">启动加载画面已平滑退出，React / Lite 扩展主组件已挂载。</p>
      <button class="test-btn" style="margin-top: 1rem;" onclick="relaunchSplash()">重新唤起加载画面</button>
    </div>

    <!-- 浮动测试台控制器：用于检验各状态 -->
    <div class="test-panel">
      <button class="test-btn" onclick="WeiwanSplash.setStatus('loading')">1. 正常加载</button>
      <button class="test-btn" onclick="WeiwanSplash.setStatus('slow')">2. 加载较久</button>
      <button class="test-btn" onclick="simulateFail()">3. 加载失败</button>
      <button class="test-btn" onclick="WeiwanSplash.ready()">4. 就绪退出 (Ready)</button>
      <button class="test-btn" onclick="toggleTheme()">切换日/夜色</button>
    </div>

    <!-- 引入独立加载控制器脚本 -->
    <script src="./splash.js"></script>
    <script>
      var currentTheme = 'light';

      // 页面加载时自动展示
      WeiwanSplash.show({
        theme: currentTheme,
        onRetry: function () {
          console.log('[WeiwanSplash] 触发重试回调');
          WeiwanSplash.setStatus('loading');
          // 模拟外部异步重试 1.2 秒后完成就绪退出
          setTimeout(function () {
            WeiwanSplash.ready();
          }, 1200);
        }
      });

      function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        WeiwanSplash.setTheme(currentTheme);
      }

      function simulateFail() {
        WeiwanSplash.fail('连接本地存储异常，SillyTavern 扩展核心尚未就绪。', function () {
          alert('外部重试回调已触发！正在重新尝试连接…');
          WeiwanSplash.setStatus('loading');
        });
      }

      function relaunchSplash() {
        WeiwanSplash.show({
          theme: currentTheme,
          onRetry: function () {
            WeiwanSplash.setStatus('loading');
            setTimeout(function () {
              WeiwanSplash.ready();
            }, 1000);
          }
        });
      }
    </script>
  </body>
</html>
